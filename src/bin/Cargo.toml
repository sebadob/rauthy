[package]
name = "rauthy"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description.workspace = true
default-run = "rauthy"
rust-version = "1.95.0"

[features]
default = ["jemalloc"]
jemalloc = ["dep:tikv-jemallocator"]

profiling = []

# Offline tool that regenerates the shipped FIDO MDS dataset. Not built into the server image.
[[bin]]
name = "fido-mds-prep"
path = "src/fido_mds_prep.rs"

[dependencies]
rauthy-common = { path = "../common" }
rauthy-error = { path = "../error" }
rauthy-handlers = { path = "../api" }
rauthy-ldap = { path = "../ldap" }
rauthy-jwt = { path = "../jwt" }
rauthy-middlewares = { path = "../middlewares" }
rauthy-data = { path = "../data" }
rauthy-schedulers = { path = "../schedulers" }
rauthy-service = { path = "../service" }

actix-web = { workspace = true }
actix-web-prom = { workspace = true }
argon2 = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }
cidr = { workspace = true }
clap = { workspace = true }
colored = { workspace = true }
cryptr = { workspace = true }
dotenvy = { workspace = true }
flume = { workspace = true }
num_cpus = { workspace = true }
openssl = { workspace = true }
openssl-sys = { workspace = true }
prometheus = { workspace = true }
regex = { workspace = true }
reqwest = { workspace = true }
rpassword = { workspace = true }
rustls = { workspace = true }
s3-simple = { workspace = true }
semver = { workspace = true }
serde_json = { workspace = true }
spow = { workspace = true }
time = { workspace = true }
tls-hot-reload = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
validator = { workspace = true }
zeroize = { workspace = true }

[target.'cfg(all(not(target_env = "msvc"), not(target_os = "openbsd"), not(target_os = "linux")))'.dependencies]
tikv-jemallocator = { workspace = true, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
tikv-jemallocator = { workspace = true, optional = true, features = [
  "unprefixed_malloc_on_supported_platforms",
] }

[dev-dependencies]
rauthy-api-types = { path = "../api_types" }

ed25519-compact = { workspace = true }
futures = { workspace = true }
josekit = "0.8"
pretty_assertions = "1"
reqwest = { workspace = true, features = ["multipart"] }
ring = { workspace = true }
tokio-test = "*"

[lints.rust]
warnings = { level = "deny", priority = -2 }
unknown_lints = { level = "allow", priority = -1 } # allow nightly lints

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }

# Permanently allowed (intentional disagreement with pedantic)
assert_is_empty = "allow"
manual_assert = "allow"
missing_errors_doc = "allow"
similar_names = "allow"
too_many_lines = "allow"
uninlined_format_args = "allow"

# Temporarily allowed (to be reviewed and enabled incrementally)
assigning_clones = "allow"
cast_lossless = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
deprecated_attributes_without_since = "allow"
doc_markdown = "allow"
ignored_unit_patterns = "allow"
ignore_without_reason = "allow"
implicit_clone = "allow"
large_futures = "allow"
map_unwrap_or = "allow"
match_same_arms = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
needless_pass_by_value = "allow"
needless_raw_string_hashes = "allow"
redundant_closure_for_method_calls = "allow"
redundant_else = "allow"
semicolon_if_nothing_returned = "allow"
single_char_pattern = "allow"
struct_excessive_bools = "allow"
struct_field_names = "allow"
unchecked_time_subtraction = "allow"
unnecessary_semicolon = "allow"
unreadable_literal = "allow"
unused_async = "allow"
wildcard_imports = "allow"
