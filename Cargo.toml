[workspace]
resolver = "3"
members = ["src/*"]
exclude = ["rauthy-client"]

[workspace.package]
version = "0.38.0-20261119"
edition = "2024"
authors = ["Sebastian Dobe <sebastiandobe@mailbox.org>"]
license = "Apache-2.0"
description = "Single Sign-On Identity & Access Management via OpenID Connect, OAuth 2, and PAM"

[profile.dev]
panic = "abort"

[profile.release]
codegen-units = 1
lto = true
strip = true
panic = "abort"

[profile.profiling]
inherits = "release"
codegen-units = 16
debug = true
lto = false
strip = false

[patch.crates-io]
#hiqlite = { git = "https://github.com/sebadob/hiqlite.git", branch = "fix-broken-catchup-logic", package = "hiqlite" }
#hiqlite-derive = { git = "https://github.com/sebadob/hiqlite.git", package = "hiqlite-derive" }
#hiqlite-wal = { git = "https://github.com/sebadob/hiqlite.git", package = "hiqlite-wal" }

[workspace.dependencies]
accept-language = "3"
actix-multipart = "0.8"
actix-web = { version = "4", features = ["rustls-0_23"] }
actix-web-lab = "0.29"
actix-web-prom = "0.10"
ahash = "0.8.12"
ammonia = "4.1"
arc-swap = "1.7"
argon2 = { version = "0.6", features = ["parallel", "zeroize"] }
askama = "0.16"
async-trait = "0.1.74"
async-compression = { version = "0.4.41", features = [
  "brotli",
  "gzip",
  "tokio",
] }
atrium-api = "0.26"
atrium-common = "0.1.4"
atrium-identity = "0.2"
atrium-oauth = "0.2"
base64 = "0.23"
bincode-next = { version = "3.1.1", features = ["derive", "serde"] }
bytes = "1.11.1"
chacha20poly1305 = { version = "0.11", features = ["rand_core", "zeroize"] }
chrono = { version = "0.4", default-features = false, features = [
  "clock",
  "serde",
  "std",
] }
chrono-tz = "0.10.4"
cidr = "0.3.0"
clap = { version = "4.6", features = ["derive", "env"] }
colored = "3"
constant_time_eq = "0.6"
cron = "0.17"
cryptr = { version = "0.12", features = ["s3", "streaming"] }
css-color = "0.2"
deadpool = { version = "0.13", features = ["rt_tokio_1", "serde"] }
deadpool-postgres = "0.14"
dotenvy = "0.15"
ed25519-compact = { version = "2.0.4", features = ["ed25519"] }
flate2 = "1.1"
flume = "0.12"
form_urlencoded = "1"
futures = "0.3"
futures-util = "0.3"
ldap3_proto = "0.9"
gethostname = "1"
hex = { version = "0.4", features = ["serde"] }
hickory-resolver = "0.26.1"
hiqlite = { version = "0.15.0", features = [
  "cache",
  "cast_ints",
  "counters",
  "dashboard",
  "listen_notify",
  "macros",
] }
hmac-sha256 = { version = "1.1.7", features = ["traits010"] }
hmac-sha512 = { version = "1.1.5", features = ["traits010", "sha384"] }
image = { version = "0.25.1", default-features = false, features = [
  "jpeg",
  "png",
  "webp",
] }
itertools = "0.15"
lettre = { version = "0.11", default-features = false, features = [
  "builder",
  "smtp-transport",
  "tokio1-rustls-tls",
  "tracing",
] }
maxminddb = "0.32"
mime = "0.3.17"
mime_guess = "2"
num_cpus = "1"
openssl = { version = "0.10.79", features = ["vendored"] }
openssl-sys = { version = "0.9.105", features = ["vendored"] }
oxrdf = "0.3.5"
oxttl = "0.2.5"
percent-encoding = "2"
postgres-types = { version = "0.2.6", features = ["derive"] }
prometheus = "0.14"
pulldown-cmark = "0.13"
rand = "0.10"
rand_core = { version = "0.10", features = [] }
rcgen = "0.14.3"
refinery = { version = "0.10", features = ["tokio-postgres"] }
regex = "1"
reqwest = { version = "0.13.3", default-features = false, features = [
  "charset",
  "form",
  "http2",
  "json",
  "stream",
  "rustls-no-provider",
] }
ring = "0.17.13"
rpassword = "7.5"
rsa = { version = "0.9.10", features = ["serde", "sha2"] }
ruma-client = { version = "0.20", features = [
  "client-api",
  "reqwest-rustls-no-provider",
] }
rusqlite = "0.40.1"
rust-embed = "8.5.0"
rustls = { version = "0.23.46", default-features = false, features = [
  "logging",
  "std",
  "tls12",
  "ring",
] }
s3-simple = "0.9.1"
semver = { version = "1.0.19", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_cbor_2 = "0.13"
serde_json = "1"
serde_json_path = "0.7.1"
serde_rusqlite = "0.43"
serde_urlencoded = "0.7.1"
spow = { version = "0.7", features = ["server"] }
strum = { version = "0.28", features = ["derive"] }
svg-hush = "0.9.4"
tar = "0.4.45"
tikv-jemallocator = "0.7"
time = { version = "0.3.47", features = [
  "formatting",
  "local-offset",
  "macros",
  "parsing",
  "serde",
] }
tls-hot-reload = "0.4.1"
toml = "1"
tracing = { version = "0.1", features = ["attributes"] }
tracing-subscriber = { version = "0.3", features = [
  "env-filter",
  "json",
  "tracing",
] }
tokio = { version = "1", features = ["full"] }
tokio-postgres = { version = "0.7.10", features = ["with-chrono-0_4"] }
tokio-postgres-rustls = { version = "0.14", features = [] }
tokio-rustls = { version = "0.26", default-features = false }
tokio-util = { version = "0.7.18", features = ["rt"] }
utoipa = { version = "6", features = [
  "actix_extras",
  "chrono",
  "openapi_extensions",
] }
utoipa-swagger-ui = { version = "10.0.2", features = ["actix-web", "vendored"] }
uuid = { version = "1.24.0", features = ["v4"] }
validator = { version = "0.21", features = ["derive"] }
wasm-bindgen = "0.2.105"
wasm-bindgen-futures = "0.4.55"
webauthn-rs = { version = "0.5", features = [
  "danger-allow-state-serialisation",
  "danger-credential-internals",
  "resident-key-support",
] }
webauthn-rs-proto = "0.5"
webpki-roots = "1"
zeroize = "1.8"

[workspace.lints.rust]
warnings = { level = "deny", priority = -2 }
unknown_lints = { level = "allow", priority = -1 } # allow nightly lints
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }

# Permanently allowed (intentional disagreement with pedantic)
assert_is_empty = "allow"
manual_assert = "allow"
missing_errors_doc = "allow"
similar_names = "allow"
too_many_lines = "allow"
uninlined_format_args = "allow"

# Temporarily allowed (to be reviewed and enabled incrementally)
assigning_clones = "allow"
case_sensitive_file_extension_comparisons = "allow"
cast_lossless = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
collapsible_else_if = "allow"
default_trait_access = "allow"
doc_markdown = "allow"
duration_suboptimal_units = "allow"
enum_glob_use = "allow"
explicit_deref_methods = "allow"
explicit_iter_loop = "allow"
format_push_string = "allow"
if_not_else = "allow"
ignored_unit_patterns = "allow"
ignore_without_reason = "allow"
implicit_clone = "allow"
implicit_hasher = "allow"
inconsistent_struct_constructor = "allow"
inline_always = "allow"
items_after_statements = "allow"
large_futures = "allow"
manual_assert_eq = "allow"
manual_let_else = "allow"
manual_midpoint = "allow"
manual_string_new = "allow"
map_unwrap_or = "allow"
match_bool = "allow"
match_same_arms = "allow"
match_wildcard_for_single_variants = "allow"
match_wild_err_arm = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
needless_continue = "allow"
needless_for_each = "allow"
needless_pass_by_value = "allow"
needless_raw_string_hashes = "allow"
option_option = "allow"
pub_underscore_fields = "allow"
redundant_closure_for_method_calls = "allow"
redundant_else = "allow"
ref_option = "allow"
return_self_not_must_use = "allow"
semicolon_if_nothing_returned = "allow"
single_char_pattern = "allow"
single_match_else = "allow"
struct_excessive_bools = "allow"
struct_field_names = "allow"
trivially_copy_pass_by_ref = "allow"
unchecked_time_subtraction = "allow"
unnecessary_semicolon = "allow"
unnecessary_trailing_comma = "allow"
unnecessary_wraps = "allow"
unreadable_literal = "allow"
unsafe_derive_deserialize = "allow"
unused_async = "allow"
unused_async_trait_impl = "allow"
wildcard_imports = "allow"
