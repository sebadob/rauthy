[dev]
dev_mode = true
dpop_http = true

[access]
token_revoke_on_logout = true
disable_refresh_token_nbf = true
password_reset_cookie_binding = true
whoami_headers = true

[auth_headers]
enable = true

[cluster]
node_id = 1
nodes = ["1 localhost:8100 localhost:8200"]
log_statements = true
# we don't need to sync any data in integration tests
log_sync = "interval_60000"
password_dashboard = "JGFyZ29uMmlkJHY9MTkkbT0zMix0PTIscD0xJE9FbFZURnAwU0V0bFJ6ZFBlSEZDT0EkTklCN0txTy8vanB4WFE5bUdCaVM2SlhraEpwaWVYOFRUNW5qdG9wcXkzQQ=="
secret_raft = "SuperSecureSecret1337"
secret_api = "SuperSecureSecret1337"

[database]
pg_host = 'localhost'
pg_user = 'rauthy'
pg_password = '123SuperSafe'

[dynamic_clients]
enable = true
# The seed default is one hour per IP. The suite registers dynamic clients from one source IP and
# runs more than once per backend, so the window is as short as the "immediately again" assertion
# in the DCR test needs it.
rate_limit_reg = 3

[cred_stuff_detection]
# The detector stores every distinct `email + password` pair it sees per source IP and blacklists
# that IP when the count reaches `blacklist_threshold` inside `scan_window`. (Almost) every
# integration test logs in with a brand new user, so a full suite run inserts a few dozen new pairs
# from 127.0.0.1 alone, and it repeats inside the 3 h window. The threshold is deliberately out of
# reach for tests; the recording code path stays active.
blacklist_threshold = 1000

[email]
rauthy_admin_email = 'admin@localhost'

[encryption]
keys = ['bVCyTsGaggVy5yqQ/UzluN29DZW41M3hTSkx6Y3NtZmRuQkR2TnJxUTYzcjQ=']
key_active = 'bVCyTsGaggVy5yqQ'

[ephemeral_clients]
enable = true
enable_web_id = true
enable_solid_aud = true
allowed_flows = ['authorization_code', 'refresh_token']
# the integration test suite serves its ephemeral client document from 127.0.0.1;
# the deny path is covered by unit tests in src/data/src/http_client.rs
danger_allow_private_addresses = true

[hashing]
argon2_m_cost = 32768
argon2_t_cost = 1
argon2_p_cost = 2
max_hash_threads = 1

[http_client]
danger_unencrypted = true
danger_insecure = true

[logging]
level = 'debug'
log_file = 'src/bin/tests/test_data/rauthy.log'
log_file_keep_for = '1d'

[mfa]
admin_force_mfa = false

[pow]
difficulty = 10

[server]
port_http = 8081
port_https = 8444
pub_url = 'localhost:8081'
scheme = 'http'
http_workers = 1

[tls]
cert_path = 'tls/cert-chain.pem'
key_path = 'tls/key.pem'

[webauthn]
rp_id = 'localhost'
rp_origin = 'http://localhost:8081'
