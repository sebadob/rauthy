name: Code Style

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

env:
  BUILDER_TAG: "20260519"
  CARGO_TERM_COLOR: always

jobs:
  check:
    if: github.event.pull_request.draft == false
    name: Check Code Style + Test
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/sebadob/rauthy-builder:${{ env.BUILDER_TAG }}
    steps:
      - uses: actions/checkout@v4
      - name: Inspect Cargo paths
        run: |
          echo "HOME=$HOME"
          echo "CARGO_HOME=${CARGO_HOME:-default}"
          cargo metadata --no-deps --format-version 1 >/dev/null
          cargo --version
          rustc --version
      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            /usr/local/cargo/registry
            /usr/local/cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ env.BUILDER_TAG }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ env.BUILDER_TAG }}-
      - name: Setup && build UI
        run: |
          just build-wasm
          
          cd frontend
          npm install
          cd ..
          
          just build-ui
      - name: Code Format Backend
        run: cargo fmt --check
      - name: Code Style Backend
        run: cargo clippy --all-targets -- -D warnings
      - name: Code Format UI
        working-directory: ./frontend
        run: npm run format-check
      - name: Code Style UI
        working-directory: ./frontend
        run: npm run check
      - name: Frontend Contract Tests
        working-directory: ./frontend
        # The Chromium reset-page test (npm run test:password-reset) is not
        # wired here: it needs a browser binary plus the already-built
        # frontend. Run it locally after `just build-ui`.
        run: npm run test:webauthn
      - name: Integration Tests against Hiqlite
        # We are running integration tests inside the same job to benefit from the already cached
        # and built assets without requiring a more complicated setup. All of this will only run
        # for merge requests ready to review anyway. Only running Hiqlite (for now) because it's a
        # simpler setup.
        run: just test-hiqlite
