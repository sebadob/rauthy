[package]
name = "axum-example"
version = "0.1.0"
edition = "2024"
authors = ["Sebastian Dobe <sebastiandobe@mailbox.org>"]
license = "Apache-2.0"

[dependencies]
rauthy-client = { path = "../..", features = ["axum", "backchannel-logout", "scim", "userinfo"] }

anyhow = "1.0.75"
axum = { version = "0.8.8", features = ["http2"] }
axum-extra = { version = "0.12.5", features = ["cookie"] }
serde_json = "1.0.140"
tokio = { version = "1.50.0", features = ["full"] }
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.23", features = ["tracing"] }

[lints.rust]
warnings = { level = "deny", priority = -2 }
unknown_lints = { level = "allow", priority = -1 } # allow nightly lints
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
redundant_clone = "deny"

# Permanently allowed (intentional disagreement with pedantic)
assert_is_empty = "allow"
manual_assert = "allow"
missing_errors_doc = "allow"
similar_names = "allow"
too_many_lines = "allow"
uninlined_format_args = "allow"

# Temporarily allowed (to be reviewed and enabled incrementally)
cast_possible_truncation = "allow"
semicolon_if_nothing_returned = "allow"
single_char_pattern = "allow"
unused_async = "allow"
unused_async_trait_impl = "allow"
